name: Deploy BamCargo to Production

# Jalan otomatis tiap ada push ke branch "prod"
# Ganti "prod" di bawah sesuai nama branch production kamu (misal "main")
on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup pnpm & Node.js
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Versi pnpm otomatis dibaca dari field "packageManager" di package.json,
        # jadi gak perlu ditulis manual di sini (biar gak konflik)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # disamain dengan versi Node.js App di cPanel (24.19.0)
          cache: 'pnpm'

      # 3. Install dependencies & build (monorepo, jalan dari root workspace)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://dev.bamcargo.co.id
          BAM_BACKEND_URL: https://online.bamcargo.co.id/api/v1

      # 4. Susun paket standalone dalam bentuk FLAT (server.js langsung di root),
      #    sesuai struktur yang udah dipakai app production kamu di cPanel
      #    (Application startup file = "server.js", bukan "apps/web/server.js").
      #    Next standalone di monorepo nge-nest jadi apps/web/... + node_modules
      #    di level atas -- kita "angkat" isi apps/web ke root, gabung node_modules-nya.
      - name: Assemble standalone deploy package (flattened)
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package

          # node_modules & package.json hasil hoist di level atas standalone
          cp -r apps/web/.next/standalone/node_modules deploy-package/node_modules
          cp apps/web/.next/standalone/package.json deploy-package/package.json

          # isi apps/web (server.js, .next server chunks, dll) diangkat ke root
          cp -r apps/web/.next/standalone/apps/web/. deploy-package/

          # kalau ada node_modules lokal khusus apps/web, gabung ke node_modules utama
          if [ -d apps/web/.next/standalone/apps/web/node_modules ]; then
            cp -r apps/web/.next/standalone/apps/web/node_modules/. deploy-package/node_modules/
          fi

          # static assets & public, ditaruh flat juga
          mkdir -p deploy-package/.next
          cp -r apps/web/.next/static deploy-package/.next/static
          cp -r apps/web/public deploy-package/public

      # 5. Upload paket ke server via rsync over SSH
      - name: Deploy build to server via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          # --delete akan hapus file di tujuan yang gak ada di source
          path: deploy-package/
          remote_path: /home/bamcar7304/dev.bamcargo.co.id/apps/web/
          remote_host: bamcargo.co.id
          remote_port: 45022
          remote_user: bamcar7304
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # 6. Symlink assets custom (kalau ada) & restart app via Passenger.
      #    TIDAK perlu pnpm install lagi di server -- node_modules udah
      #    ikut kebawa lengkap di dalam standalone package.
      - name: Post-deploy commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: bamcargo.co.id
          port: 45022
          username: bamcar7304
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/bamcar7304/dev.bamcargo.co.id/apps/web

            # Kalau kamu punya storage assets terpisah yang di-symlink manual,
            # sesuaikan baris ini (opsional, hapus kalau gak perlu)
            rm -rf public/storage
            ln -s /home/bamcar7304/bamcargo_storage public/storage

            # Trigger restart lewat Passenger (cPanel Node.js App)
            mkdir -p tmp
            touch tmp/restart.txt