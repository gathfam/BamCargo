name: Deploy BamCargo to Production

# Jalan otomatis tiap ada push ke branch "prod"
# Ganti "prod" di bawah sesuai nama branch production kamu (misal "main")
on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup pnpm & Node.js
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Versi pnpm otomatis dibaca dari field "packageManager" di package.json,
        # jadi gak perlu ditulis manual di sini (biar gak konflik)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # disamain dengan versi Node.js App di cPanel (24.19.0)
          cache: 'pnpm'

      # 3. Install dependencies & build (monorepo, jalan dari root workspace)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://bamcargo.co.id
          BAM_BACKEND_URL: https://online.bamcargo.co.id/api/v1
          BAM_API_KEY: ${{ secrets.BAM_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ""
          DB_NAME: bamcargo_db

      # 4. Susun paket standalone dalam bentuk FLAT (server.js langsung di root),
      #    sesuai struktur yang udah dipakai app production kamu di cPanel
      #    (Application startup file = "server.js", bukan "apps/web/server.js").
      #    Next standalone di monorepo nge-nest jadi apps/web/... + node_modules
      #    di level atas -- kita "angkat" isi apps/web ke root, gabung node_modules-nya.
      - name: Verify standalone output
        run: |
          echo "=== Checking standalone structure ==="
          ls -la apps/web/.next/standalone/ || echo "ERROR: standalone folder missing"
          ls -la apps/web/.next/standalone/apps/web/ || echo "ERROR: nested apps/web missing"

      - name: Assemble standalone deploy package (flattened)
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package

          # isi apps/web (server.js, .next server chunks, package.json) diangkat ke root
          cp -r apps/web/.next/standalone/apps/web/. deploy-package/

          # node_modules dari level atas standalone
          cp -r apps/web/.next/standalone/node_modules deploy-package/node_modules

          # static assets
          mkdir -p deploy-package/.next
          cp -r apps/web/.next/static deploy-package/.next/static

          # public folder (kalau ada di repo)
          if [ -d apps/web/public ]; then
            cp -r apps/web/public deploy-package/public
          else
            echo "⚠️  apps/web/public not found in repo, skipping..."
            mkdir -p deploy-package/public
          fi

      # 5. Copy critical files from repo to deploy package (public assets ignored by git)
      - name: Copy critical public assets
        run: |
          # Copy logo dan favicon yang penting
          mkdir -p deploy-package/public
          cp apps/web/public/logo-Bam-Cargo-100.png deploy-package/public/ 2>/dev/null || echo "Logo not found"
          cp apps/web/public/favicon.ico deploy-package/public/ 2>/dev/null || echo "Favicon not found"

      # 6. Compress deploy package
      - name: Create deployment archive
        run: |
          cd deploy-package
          tar -czf ../deploy.tar.gz .
          cd ..
          ls -lh deploy.tar.gz

      # 6. Upload via SCP
      - name: Upload build to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: bamcargo.co.id
          port: 45022
          username: bamcar7304
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/bamcar7304/"

      # 7. Extract & cleanup on server
      - name: Extract and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: bamcargo.co.id
          port: 45022
          username: bamcar7304
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/bamcar7304

            # Backup existing deployment (optional)
            if [ -d dev.bamcargo.co.id/apps/web_backup ]; then
              rm -rf dev.bamcargo.co.id/apps/web_backup
            fi
            if [ -d dev.bamcargo.co.id/apps/web ]; then
              mv dev.bamcargo.co.id/apps/web dev.bamcargo.co.id/apps/web_backup
            fi

            # Extract new build
            mkdir -p dev.bamcargo.co.id/apps/web
            tar -xzf deploy.tar.gz -C dev.bamcargo.co.id/apps/web/
            rm deploy.tar.gz

            cd dev.bamcargo.co.id/apps/web

            # Create .env file with production secrets
            echo "NEXT_PUBLIC_APP_URL=https://bamcargo.co.id" > .env
            echo "BAM_BACKEND_URL=https://online.bamcargo.co.id/api/v1" >> .env
            echo "BAM_API_KEY=${{ secrets.BAM_API_KEY }}" >> .env
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env
            echo "NEXTAUTH_URL=https://bamcargo.co.id" >> .env
            echo "DB_HOST=127.0.0.1" >> .env
            echo "DB_PORT=3306" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env

            # Symlink storage
            rm -rf public/storage
            ln -s /home/bamcar7304/bamcargo_storage public/storage

            # Trigger restart
            mkdir -p tmp
            touch tmp/restart.txt