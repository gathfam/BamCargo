  name: Deploy BamCargo to Production
  
  # Jalan otomatis tiap ada push ke branch "prod"
  # Ganti "prod" di bawah sesuai nama branch production kamu (misal "main")
  on:
    push:
      branches:
        - prod
  
  jobs:
    build-and-deploy:
      runs-on: ubuntu-latest
  
      steps:
        # 1. Ambil source code
        - name: Checkout repository
          uses: actions/checkout@v4
  
        # 2. Setup pnpm & Node.js
        - name: Setup pnpm
          uses: pnpm/action-setup@v4
          # Versi pnpm otomatis dibaca dari field "packageManager" di package.json,
          # jadi gak perlu ditulis manual di sini (biar gak konflik)
  
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20 # sesuaikan dengan versi Node.js di cPanel Setup Node.js App
            cache: 'pnpm'
  
        # 3. Install dependencies & build (monorepo, jalan dari root workspace)
        - name: Install dependencies
          run: pnpm install --frozen-lockfile
  
        - name: Build project
          run: pnpm build
          env:
            NEXT_PUBLIC_APP_URL: https://bamcargo.co.id
  
        # 4. Susun paket standalone: gabungin hasil trace (.next/standalone),
        #    static assets, dan folder public jadi satu folder siap upload.
        #    Next.js standalone TETAP ngikutin struktur monorepo (apps/web/...)
        #    di dalam folder ini, jadi jangan diflatten.
        - name: Assemble standalone deploy package
          run: |
            rm -rf deploy-package
            mkdir -p deploy-package
            cp -r apps/web/.next/standalone/. deploy-package/
            mkdir -p deploy-package/apps/web/.next
            cp -r apps/web/.next/static deploy-package/apps/web/.next/static
            cp -r apps/web/public deploy-package/apps/web/public
  
        # 5. Upload paket ke server via rsync over SSH
        - name: Deploy build to server via rsync
          uses: burnett01/rsync-deployments@7.0.2
          with:
            switches: -avzr --delete
            # --delete akan hapus file di tujuan yang gak ada di source
            # HATI-HATI: pastikan remote_path BENAR sebelum jalan pertama kali
            path: deploy-package/
            remote_path: /home/bamcar7304/app.bamcargo.co.id/  # GANTI: folder khusus buat paket standalone ini
            remote_host: bamcargo.co.id
            remote_port: 45022
            remote_user: bamcar7304
            remote_key: ${{ secrets.VPS_SSH_KEY }}
  
        # 6. Symlink assets custom (kalau ada) & restart app via Passenger.
        #    TIDAK perlu pnpm install lagi di server -- node_modules udah
        #    ikut kebawa lengkap di dalam standalone package.
        - name: Post-deploy commands via SSH
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: bamcargo.co.id
            port: 45022
            username: bamcar7304
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              cd /home/bamcar7304/app.bamcargo.co.id/  # GANTI: sama seperti remote_path di atas
  
              # Kalau kamu punya storage assets terpisah yang di-symlink manual,
              # sesuaikan baris ini (opsional, hapus kalau gak perlu)
              # rm -rf apps/web/public/storage
              # ln -s /home/bamcar7304/bamcargo_storage apps/web/public/storage
  
              # Trigger restart lewat Passenger (cPanel Node.js App)
              mkdir -p tmp
              touch tmp/restart.txt